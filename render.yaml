# Render Blueprint (guide: docs/deployment.md). Secrets are entered in the Render dashboard, never here.
# - omniai: free web service; builds the React app and runs FastAPI, which serves the site and /api.
#   The database is Neon Postgres (external). Free web services sleep after ~15 min idle.
# - omniai-app: free static site (never sleeps) whose start page is the welcome page: it shows at once,
#   wakes omniai in the background, and Join / Log in open the app when it answers, so visitors never
#   see Render's own waking page. Old links to an app tab (#dashboard...) are forwarded.
services:
  - type: web
    name: omniai
    runtime: python
    plan: free
    region: singapore            # same region as the Neon database
    buildCommand: >-
      echo "node $(node --version), $(python --version)" &&
      pip install -r backend/requirements.txt &&
      cd frontend && npm ci --include=dev && npm run build
    startCommand: >-
      cd backend &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass   # a push to main deploys only after CI passes (.github/workflows/ci.yml)
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL        # Neon connection string (asked for when the Blueprint is created)
        sync: false
      - key: LLM_API_KEY         # Groq key (asked for when the Blueprint is created)
        sync: false
      - key: SECRET_KEY          # signs login sessions; Render generates a random one
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_APP_URL       # used to build links in emails (never taken from the request)
        value: https://omniai-hkv2.onrender.com
      - key: BREVO_API_KEY        # password-reset emails (docs/deployment.md); empty = Forgot password hidden
        sync: false
      - key: EMAIL_FROM           # the sender address verified in Brevo
        sync: false
      - key: SENTRY_DSN           # optional error reports; paste the DSN from sentry.io (docs/deployment.md)
        sync: false
      - key: AI_DAILY_MESSAGE_LIMIT   # AI messages per user per day (0 = unlimited)
        value: "20"
      - key: GOOGLE_CLIENT_ID      # Continue with Google; public, so kept here
        value: 46117983475-u7cg29tsiu5kqc65isvne3s6ttu3vbb8.apps.googleusercontent.com
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      # Optional NVIDIA backup (backend/llm_pool.json): add LLM_API_KEY_2 in the dashboard to
      # enable it. Its free tier is for prototyping only, so it's off by default here.

  - type: web
    name: omniai-app
    runtime: static
    # The welcome page becomes the site's start page; the app's own index.html isn't published here.
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      mv dist/welcome.html dist/index.html
    staticPublishPath: frontend/dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite            # any path (e.g. an old bookmark) shows the welcome page
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_APP_URL        # the app the welcome page wakes and sends people to
        value: https://omniai-hkv2.onrender.com
