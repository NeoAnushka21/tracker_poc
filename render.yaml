# Render Blueprint (guide: docs/deployment.md). Secrets are entered in the Render dashboard, never here.
# - omniai: free web service; builds the React app and runs FastAPI, which serves the site and /api.
#   The database is Neon Postgres (external). Free web services sleep after ~15 min idle.
# - omniai-app: free static site (never sleeps) with only the launcher page: it shows the dancing
#   MacBro while omniai wakes up, then opens it, so visitors never see Render's own waking page.
services:
  - type: web
    name: omniai
    runtime: python
    plan: free
    region: singapore            # same region as the Neon database
    buildCommand: >-
      echo "node $(node --version), $(python --version)" &&
      pip install -r backend/requirements.txt &&
      cd frontend && npm ci --include=dev && npm run build
    startCommand: >-
      cd backend &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeployTrigger: commit    # every push to main redeploys
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL        # Neon connection string (asked for when the Blueprint is created)
        sync: false
      - key: LLM_API_KEY         # Groq key (asked for when the Blueprint is created)
        sync: false
      - key: SECRET_KEY          # signs login sessions; Render generates a random one
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      # Optional NVIDIA backup (backend/llm_pool.json): add LLM_API_KEY_2 in the dashboard to
      # enable it. Its free tier is for prototyping only, so it's off by default here.

  - type: web
    name: omniai-app
    runtime: static
    # The launcher becomes the site's start page; the app's own index.html isn't published here.
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      mv dist/launcher.html dist/index.html
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite            # any path (e.g. an old bookmark) shows the launcher
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_APP_URL        # where the launcher sends people once the app is awake
        value: https://omniai-hkv2.onrender.com
