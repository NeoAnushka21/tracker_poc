# Render Blueprint: one free web service that builds the React app and runs the FastAPI
# backend, which serves both the site and /api. The database is Neon Postgres (external).
# Guide: docs/deployment.md. Secrets are entered in the Render dashboard, never here.
services:
  - type: web
    name: omniai
    runtime: python
    plan: free
    region: singapore            # same region as the Neon database
    buildCommand: >-
      echo "node $(node --version), $(python --version)" &&
      pip install -r backend/requirements.txt &&
      cd frontend && npm ci --include=dev && npm run build
    startCommand: >-
      cd backend &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeployTrigger: commit    # every push to main redeploys
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL        # Neon connection string (asked for when the Blueprint is created)
        sync: false
      - key: LLM_API_KEY         # Groq key (asked for when the Blueprint is created)
        sync: false
      - key: SECRET_KEY          # signs login sessions; Render generates a random one
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      # Optional NVIDIA backup (backend/llm_pool.json): add LLM_API_KEY_2 in the dashboard to
      # enable it. Its free tier is for prototyping only, so it's off by default here.
